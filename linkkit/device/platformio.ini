; LinkKit's device library on its own (README.md, Building and testing):
; its unit tests on the Mac, test/, with a fake app (test/kit_fakes.h) and
; nothing of any real app's. Apps don't use this file: they take the
; library through library.json.
;   pio test -d linkkit/device -e native
; Boop runs it through firmware/tools/pio.sh (make -C internal fw-test).
[platformio]
src_dir = src
test_dir = test

[env:native]
platform = native
build_flags =
    -std=c++17
    -Isrc
    -Wall
test_build_src = yes
lib_deps =
    bblanchon/ArduinoJson @ 7.4.3
